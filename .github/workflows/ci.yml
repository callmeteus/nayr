name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests (host platform only — fast feedback, runs before build)
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.14.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Run unit tests
        run: zig build test

  # ---------------------------------------------------------------------------
  # Cross-compile for all supported targets in a single job.
  # zig build cross produces:
  #   zig-out/bin/x86_64-linux/nayr
  #   zig-out/bin/aarch64-linux/nayr
  #   zig-out/bin/x86_64-windows/nayr.exe
  # ---------------------------------------------------------------------------
  build:
    name: Build (all targets)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.14.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Cross-compile
        run: zig build cross

      - name: List built binaries
        run: find zig-out/bin -type f | sort

      - name: Upload nayr-x86_64-linux
        uses: actions/upload-artifact@v4
        with:
          name: nayr-x86_64-linux
          path: zig-out/bin/x86_64-linux/nayr
          if-no-files-found: error
          retention-days: 30

      - name: Upload nayr-aarch64-linux
        uses: actions/upload-artifact@v4
        with:
          name: nayr-aarch64-linux
          path: zig-out/bin/aarch64-linux/nayr
          if-no-files-found: error
          retention-days: 30

      - name: Upload nayr-x86_64-windows
        uses: actions/upload-artifact@v4
        with:
          name: nayr-x86_64-windows
          path: zig-out/bin/x86_64-windows/nayr.exe
          if-no-files-found: error
          retention-days: 30
